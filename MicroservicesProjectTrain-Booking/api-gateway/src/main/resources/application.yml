server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-public
          uri: lb://user-service
          predicates:
            - Path=/public/**
        - id: user-service-user
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: train-service
          uri: lb://train-service
          predicates:
            - Path=/trains/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/bookings/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
