spring.application.name=booking-service
server.port=8083

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/train_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Boss@8055
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=6379

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ─── Feign Client Configuration ───────────────────────────────────────────────
# Enable Feign fallback (circuit-breaker style)
spring.cloud.openfeign.circuitbreaker.enabled=true
# Log full request/response in dev (set NONE in prod)
feign.client.config.default.loggerLevel=FULL
logging.level.com.example.IRCTC.client=DEBUG
# Feign timeout settings (ms)
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000

